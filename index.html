<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF1F4">
<title>Scales &amp; Huddle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<style>
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#16202B; --muted:#66747F; --line:#D5DCE3; --peer:#E4E9EE; --cell:#F4F6F9;
  --stage-top:#FFFFFF; --stage-bot:#F0F3F7; --shadow:rgba(22,32,43,.16);
  --accent:#D98A00; --accent-soft:#F8E7C6; --bad:#C23B33; --ok:#23895A; --ok-soft:#DCEFE3;
  --wire:#8794A0; --tray:#C9D2DB;
  --h0:#FFC933; --h0b:#FFDD73; --t0:#4A3300;
  --h1:#0FA386; --h1b:#2FC9A8; --t1:#FFFFFF;
  --h2:#4A2DB5; --h2b:#6A4FD6; --t2:#FFFFFF;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151C; --surface:#18212B; --ink:#E8EDF2; --muted:#8E9CA9; --line:#2B3744; --peer:#212C38; --cell:#1C2631;
  --stage-top:#1B2530; --stage-bot:#141C25; --shadow:rgba(0,0,0,.5);
  --accent:#F2B13F; --accent-soft:#3A2E17; --bad:#F2736A; --ok:#5DC98B; --ok-soft:#183325;
  --wire:#8E9CA9; --tray:#3A4857;
  --h0:#FFCF4D; --h0b:#FFE08A; --t0:#2A1E00;
  --h1:#19B896; --h1b:#3FD8B5; --t1:#FFFFFF;
  --h2:#6448D8; --h2b:#8670F0; --t2:#FFFFFF; color-scheme:dark }}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:500px;margin:0 auto;padding-block:14px 36px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.tabs{display:flex;gap:22px;align-items:flex-end}
.tabs button{position:relative;border:0;background:none;padding:2px 0 8px;font-family:var(--display);font-weight:800;font-size:2rem;letter-spacing:-.025em;line-height:1;color:var(--line);transition:color .25s}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;border-radius:2px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.tabs button[aria-selected="true"]::after{transform:scaleX(1)}

.panel{display:flex;flex-direction:column;gap:12px}
.panel[hidden]{display:none}
.panel.enter{animation:rise .35s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}

.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spacer{flex:1}
.seg{position:relative;display:inline-flex;background:var(--peer);border-radius:10px;padding:3px}
.seg button{position:relative;z-index:1;border:0;background:transparent;padding:6px 11px;border-radius:8px;font-size:.88rem;font-weight:700;color:var(--muted);transition:color .2s}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg .thumb{position:absolute;top:3px;bottom:3px;border-radius:8px;background:var(--surface);box-shadow:0 1px 3px var(--shadow);transition:left .28s cubic-bezier(.2,.8,.2,1),width .28s cubic-bezier(.2,.8,.2,1)}
.timer{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.95rem;min-width:2.8em;text-align:right}
.icon{width:36px;height:36px;border:0;border-radius:10px;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
.icon:hover,.icon[aria-expanded="true"]{background:var(--peer);color:var(--ink)}
.icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.help{background:var(--surface);border-radius:14px;padding:14px 16px;font-size:.92rem;display:flex;flex-direction:column;gap:8px;box-shadow:0 1px 2px var(--shadow);animation:rise .25s cubic-bezier(.2,.8,.2,1)}
.help[hidden]{display:none}
.help p{margin:0}
.help b{font-family:var(--display)}
.help .muted{color:var(--muted)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;border:0;background:none;padding:4px 0 0;width:100%;text-align:left;color:var(--muted);font-size:.9rem}
.switch .knob{flex:none;width:40px;height:24px;border-radius:12px;background:var(--line);position:relative;transition:background .2s}
.switch .knob::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px var(--shadow);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.switch[aria-checked="true"] .knob{background:var(--ink)}
.switch[aria-checked="true"] .knob::after{transform:translateX(16px)}

.foot{display:flex;align-items:center;gap:8px;min-height:40px}
.toast{flex:1;font-size:.9rem;color:var(--muted);opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:none}
.toast.warn{color:var(--bad)}
.btn{border:0;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-weight:700;font-size:.92rem;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--peer);color:var(--ink)}

.win{display:flex;align-items:center;gap:14px;background:var(--ok-soft);border-radius:16px;padding:14px 16px;animation:pop-in .45s cubic-bezier(.2,1.4,.4,1)}
.win[hidden]{display:none}
@keyframes pop-in{from{opacity:0;transform:translateY(10px) scale(.96)}}
.win .badge{flex:none;width:40px;height:40px;border-radius:50%;background:var(--ok);display:flex;align-items:center;justify-content:center}
.win .badge svg{width:22px;height:22px;fill:none;stroke:var(--surface);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30;animation:draw .4s .2s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.win .txt{flex:1;min-width:0}
.win .big{font-family:var(--display);font-weight:800;font-size:1.25rem;line-height:1.1;color:var(--ink)}
.win .small{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.win .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

/* ---------- Scales ---------- */
.stage{background:linear-gradient(var(--stage-top),var(--stage-bot));border-radius:20px;padding:4px 6px 10px;box-shadow:0 1px 2px var(--shadow);display:flex;justify-content:center;touch-action:none}
.stage svg{width:100%;height:auto;max-height:64vh;display:block;overflow:visible}
.stage [data-pan]{cursor:pointer}
.stage [data-item]{cursor:grab}
.tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:4px 0;min-height:54px}
.die{width:46px;height:46px;border:0;background:transparent;padding:0;border-radius:11px;touch-action:none;transition:transform .18s cubic-bezier(.2,1.4,.4,1),filter .18s;cursor:grab}
.die svg{width:100%;height:100%;display:block;overflow:visible}
.die.sel{transform:translateY(-6px) scale(1.06);filter:drop-shadow(0 6px 6px var(--shadow))}
.die.sel .face{stroke:var(--accent);stroke-width:2.6}
.die.lifted{opacity:.25}
.die:disabled{cursor:default}
.die.back{animation:pop-in .3s cubic-bezier(.2,1.4,.4,1)}
.ghost-die{position:fixed;left:0;top:0;width:58px;height:58px;pointer-events:none;z-index:50;filter:drop-shadow(0 10px 8px var(--shadow))}
.ghost-die svg{width:100%;height:100%;display:block;overflow:visible}
.dots{margin:-4px 0 0;text-align:center;color:var(--muted);font-size:.82rem;font-variant-numeric:tabular-nums}

/* ---------- Huddle ---------- */
.board{background:var(--surface);border-radius:22px;padding:10px;box-shadow:0 1px 2px var(--shadow),0 10px 24px -14px var(--shadow)}
.hgrid{display:grid;gap:6px;width:100%;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.hc{position:relative;aspect-ratio:1/1;min-width:0;min-height:0;overflow:hidden;border:0;border-radius:12px;background:var(--cell);box-shadow:inset 0 0 0 1.5px var(--line);padding:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:clamp(1.15rem,6vw,1.75rem);line-height:1;font-variant-numeric:tabular-nums;color:var(--ink);transition:box-shadow .2s}
.hc.k0,.hc.k1,.hc.k2{box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -4px 0 rgba(0,0,0,.16),0 1px 2px var(--shadow)}
.hc.k0{background:linear-gradient(165deg,var(--h0b),var(--h0));color:var(--t0)}
.hc.k1{background:linear-gradient(165deg,var(--h1b),var(--h1));color:var(--t1)}
.hc.k2{background:linear-gradient(165deg,var(--h2b),var(--h2));color:var(--t2)}
.hc .gl{position:absolute;top:5px;left:7px;font-size:.5em;opacity:.8;line-height:1}
.hc.given::after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55;bottom:6px;right:6px}
.hc .num{display:flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;border-radius:50%;transition:opacity .3s,background-color .2s}
.hc .num.met{opacity:.4}
.hc .num.bad{color:var(--bad);background:var(--surface);box-shadow:0 1px 3px var(--shadow);font-size:.9em}
.hc.just{animation:paint .28s cubic-bezier(.2,1.5,.4,1)}
@keyframes paint{0%{transform:scale(.8)}100%{transform:scale(1)}}
.hgrid.won .hc{animation:wave .55s cubic-bezier(.2,1.2,.4,1) both}
@keyframes wave{40%{transform:translateY(-5px) scale(1.06);filter:brightness(1.12)}100%{transform:none}}
.palette{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sw{position:relative;height:58px;border:0;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:6px;font-family:var(--display);font-weight:800;font-size:1.35rem;font-variant-numeric:tabular-nums;box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -4px 0 rgba(0,0,0,.16);transition:transform .18s cubic-bezier(.2,1.4,.4,1),opacity .2s}
.sw:active{transform:scale(.95)}
.sw[aria-pressed="true"]{transform:translateY(-4px);box-shadow:0 0 0 3px var(--bg),0 0 0 5.5px var(--ink),0 8px 12px var(--shadow)}
.sw.out{opacity:.35}
.sw.erase{background:var(--peer);color:var(--muted);box-shadow:none}
.sw.erase[aria-pressed="true"]{color:var(--ink);box-shadow:0 0 0 3px var(--bg),0 0 0 5.5px var(--ink)}
.sw .g{font-size:.8rem;opacity:.85}
.sw svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="tabs" role="tablist">
    <button id="tab-scales" role="tab" aria-selected="true" aria-controls="scales">Scales</button>
    <button id="tab-huddle" role="tab" aria-selected="false" aria-controls="huddle">Huddle</button>
  </nav>

  <section class="panel" id="scales" role="tabpanel" aria-labelledby="tab-scales">
    <div class="toolbar">
      <div class="seg" id="sc-diff">
        <button id="sd-e" data-l="easy" aria-pressed="true">Easy</button>
        <button id="sd-m" data-l="medium" aria-pressed="false">Medium</button>
        <button id="sd-h" data-l="hard" aria-pressed="false">Hard</button>
      </div>
      <span class="spacer"></span>
      <span class="timer" id="sc-time">0:00</span>
      <button class="icon" id="sc-help-btn" aria-label="How to play" aria-expanded="false" aria-controls="sc-help"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.5"/><path d="M12 16.9v.1"/></svg></button>
    </div>
    <div class="help" id="sc-help" hidden>
      <p>Hang every die so <b>each bar balances</b>: both sides under a bar hold the same number of dots.</p>
    </div>
    <div class="stage" id="sc-stage"></div>
    <div class="tray" id="sc-tray"></div>
    <p class="dots" id="sc-dots"></p>
    <div class="win" id="sc-win" hidden></div>
    <div class="foot">
      <span class="toast" id="sc-toast" aria-live="polite"></span>
      <button class="icon" id="sc-clear" aria-label="Take all dice back"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg></button>
      <button class="btn ghost" id="sc-new">New</button>
    </div>
  </section>

  <section class="panel" id="huddle" role="tabpanel" aria-labelledby="tab-huddle" hidden>
    <div class="toolbar">
      <div class="seg" id="hd-diff">
        <button id="hd-e" data-l="easy" aria-pressed="true">4×4</button>
        <button id="hd-m" data-l="medium" aria-pressed="false">5×5</button>
        <button id="hd-h" data-l="hard" aria-pressed="false">6×6</button>
      </div>
      <span class="spacer"></span>
      <span class="timer" id="hd-time">0:00</span>
      <button class="icon" id="hd-help-btn" aria-label="How to play" aria-expanded="false" aria-controls="hd-help"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.5"/><path d="M12 16.9v.1"/></svg></button>
    </div>
    <div class="help" id="hd-help" hidden>
      <p>Color every square. A number says <b>how many neighbors share its color</b>, counting up, down, left and right.</p>
      <p>Each color must form <b>one connected shape</b>.</p>
      <p class="muted">Dotted squares are fixed.</p>
      <button class="switch" id="hd-sym" role="switch" aria-checked="false">Show symbols on colors<span class="knob"></span></button>
    </div>
    <div class="board"><div class="hgrid" id="hd-grid"></div></div>
    <div class="palette" id="hd-pal"></div>
    <div class="win" id="hd-win" hidden></div>
    <div class="foot">
      <span class="toast" id="hd-toast" aria-live="polite"></span>
      <button class="icon" id="hd-clear" aria-label="Clear the board"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg></button>
      <button class="btn ghost" id="hd-new">New</button>
    </div>
  </section>
</div>

<script>
// GEN-START
const rnd=n=>Math.floor(Math.random()*n);
const range=n=>[...Array(n).keys()];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const popc=x=>{let k=0;while(x){x&=x-1;k++}return k};
const lowbit=x=>31-Math.clz32(x&-x);

/* ================= SCALES (hanging mobile, equal arms, dice weights) ================= */
// depth = number of bar layers a pan can hang below; harder levels are taller as well as wider.
const MOB_LEVELS={
  easy:  {pans:3,depth:2,chain:0, minW:6, maxW:8, maxAspect:9},
  medium:{pans:5,depth:4,chain:.9,minW:8, maxW:10,maxAspect:1.1},
  hard:  {pans:6,depth:5,chain:.9,minW:10,maxW:13,maxAspect:1.0}
};
function mobShape(k,d,chain){ // chain = odds of peeling a single pan off a bar, which makes the mobile taller than wide
  if(k===1)return{pan:true};
  if(d===0)return null;
  const i=Math.random()<chain?(Math.random()<.5?1:k-1):1+rnd(k-1),l=mobShape(i,d-1,chain),r=mobShape(k-i,d-1,chain);
  return l&&r?{pan:false,l,r}:null;
}
function pansOf(node,depth=0,out=[]){
  if(node.pan){node.depth=depth;out.push(node)}else{pansOf(node.l,depth+1,out);pansOf(node.r,depth+1,out)}
  return out;
}
function multisets(c,s){ // sorted arrays of c dice values (1-6) summing to s
  const out=[];
  (function go(cur,start,rem){
    if(cur.length===c){if(rem===0)out.push(cur.slice());return}
    for(let v=start;v<=6;v++){
      const left=c-cur.length;
      if(v*left>rem)break;
      if(6*left<rem)continue;
      cur.push(v);go(cur,v,rem-v);cur.pop();
    }
  })([],1,s);
  return out;
}
const cnt=(ms,v)=>ms.reduce((a,x)=>a+(x===v),0);
function mobSolution(level){
  const {pans:k,depth,chain,minW,maxW,maxAspect}=MOB_LEVELS[level];
  for(let t=0;t<20000;t++){
    const root=mobShape(k,depth,chain);if(!root||root.pan)continue;
    const P=pansOf(root);
    const maxD=Math.max(...P.map(p=>p.depth));
    if(maxD<depth)continue; // must actually reach the level's height
    P.forEach((p,i)=>{p.id=i;p.cap=1+rnd(3)});
    const nW=P.reduce((a,p)=>a+p.cap,0);if(nW<minW||nW>maxW)continue;
    mobLayout(root);if((root.L+root.R+32)/(root.H+74)>maxAspect)continue; // keep it taller than wide so the dice stay big on a phone
    const unit=1<<maxD,totals=[];
    for(let T=unit;T<=200;T+=unit)if(P.every(p=>{const s=T>>p.depth;return s>=p.cap&&s<=6*p.cap}))totals.push(T);
    if(!totals.length)continue;
    const T=totals[rnd(totals.length)];
    P.forEach(p=>{p.sum=T>>p.depth;const o=multisets(p.cap,p.sum);p.ms=o[rnd(o.length)]});
    const inv=[0,0,0,0,0,0,0];P.forEach(p=>p.ms.forEach(v=>inv[v]++));
    if(inv.filter(Boolean).length<4)continue; // keep some variety in the tray
    return{root,pans:P,total:T,inv};
  }
  return null;
}
// Human-style solver: list the dice combinations each pan could hold, then cross them with the tray supply.
function solveMob(pz,locks){
  const P=pz.pans,inv=pz.inv;
  const lockedIn=i=>locks.filter(l=>l[0]===i).map(l=>l[1]);
  let cand=P.map((p,i)=>multisets(p.cap,p.sum).filter(ms=>{
    const need=lockedIn(i);return [1,2,3,4,5,6].every(v=>cnt(ms,v)>=cnt(need,v));
  }));
  let rounds=0,changed=true;
  while(changed){
    changed=false;rounds++;if(rounds>40)break;
    for(let v=1;v<=6;v++){
      const mins=cand.map(cs=>Math.min(...cs.map(ms=>cnt(ms,v)))),maxs=cand.map(cs=>Math.max(...cs.map(ms=>cnt(ms,v))));
      const sMin=mins.reduce((a,b)=>a+b,0),sMax=maxs.reduce((a,b)=>a+b,0);
      cand=cand.map((cs,i)=>{
        const lo=inv[v]-(sMax-maxs[i]),hi=inv[v]-(sMin-mins[i]);
        const f=cs.filter(ms=>{const c=cnt(ms,v);return c>=lo&&c<=hi});
        if(f.length!==cs.length)changed=true;
        return f;
      });
      if(cand.some(cs=>!cs.length))return{solved:false,broken:true};
    }
  }
  return{solved:cand.every(cs=>cs.length===1),rounds,cand};
}
function genMobile(level){
  for(let t=0;t<300;t++){
    const pz=mobSolution(level);if(!pz)continue;
    const pool=shuffle(pz.pans.flatMap(p=>p.ms.map(v=>[p.id,v])));
    let locks=[];
    for(const l of pool){if(solveMob(pz,locks).solved)break;locks.push(l)}
    if(!solveMob(pz,locks).solved)continue;
    for(const l of shuffle(locks.slice())){const tr=locks.filter(x=>x!==l);if(solveMob(pz,tr).solved)locks=tr}
    const nW=pz.pans.reduce((a,p)=>a+p.cap,0);
    if(locks.length>Math.floor(nW/4))continue;
    const r=solveMob(pz,locks);
    if(r.rounds<(level==='easy'?2:3))continue;
    return{...pz,locks,rounds:r.rounds,nW};
  }
  return null;
}

/* ================= HUDDLE ================= */
const HUDDLE_LEVELS={easy:{n:4,counts:[7,5,4]},medium:{n:5,counts:[10,8,7]},hard:{n:6,counts:[14,12,10]}};
function nbrs(n,i){const r=i/n|0,c=i%n,o=[];if(r)o.push(i-n);if(r<n-1)o.push(i+n);if(c)o.push(i-1);if(c<n-1)o.push(i+1);return o}
function sameCount(n,g,i){return nbrs(n,i).filter(j=>g[j]===g[i]).length}
function huddleGroups(n,counts){
  for(let t=0;t<500;t++){
    const N=n*n,g=Array(N).fill(-1),size=counts.map(()=>1);
    const seeds=shuffle(range(N)).slice(0,counts.length);
    seeds.forEach((s,k)=>g[s]=k);
    let left=N-counts.length,stuck=false;
    while(left>0){

    for(const c of shuffle(clues.slice())){const tr=clues.filter(x=>x!==c);if(solveHuddle(pz,tr,givens).solved)clues=tr}
    for(const g of shuffle(givens.slice())){const tr=givens.filter(x=>x!==g);if(solveHuddle(pz,clues,tr).solved)givens=tr}

const GAPX=14;

  if(node.pan){node.W=node.cap*(DIE+6)+16;node.ext=[[node.W/2,node.W/2],[node.W/2,node.W/2]];node.L=node.R=node.W/2;node.H=HOOK+TRAY;return}

  const lo=l.pan?0:1,ro=r.pan?0:1,rows=Math.max(l.ext.length+lo,r.ext.length+ro,1);
  let a=40;
  for(let k=0;k<rows;k++){const le=l.ext[k-lo],re=r.ext[k-ro];if(le&&re)a=Math.max(a,(le[1]+re[0]+GAPX)/2)}

  if(silent)return;
  const allPlaced=S.items.every(it=>it.at>=0),allBal=bars().every(b=>{const s=subtree(b);return s.l.dots===s.r.dots});
  if(allPlaced&&allBal){
    S.won=true;S.timer.stop();renderTray();buzz([15,60,25]);
    const t=fmt(S.timer.secs());
    setTimeout(()=>showWin('sc-win','Hung level',`${LEVEL_NAME[S.level]} · ${t}`,`⚖️ Scales ${LEVEL_NAME[S.level]} · ${t}`,newScales),reduceMotion?0:420);
  }else if(allPlaced)toast('sc-toast','A bar is tipping',true);
  else hideToast('sc-toast');
}
$('sc-new').onclick=newScales;
$('sc-clear').onclick=()=>{if(S.won)return;S.items.forEach(it=>{if(!it.locked)it.at=-1});S.sel=-1;afterScales()};
for(const b of $('sc-diff').querySelectorAll('button'))b.onclick=()=>{S.level=b.dataset.l;segSet($('sc-diff'),b);newScales()};
helpInit('sc');

/* ================= Huddle UI ================= */
const GLYPH=['●','▲','■'],CNAME=['Gold','Jade','Grape'];
const H={p:null,level:'easy',sym:store('sh-sym')==='1',g:[],cells:[],paint:0,won:false,just:-1,timer:makeTimer($('hd-time'))};
function newHuddle(){
  $('hd-sym').setAttribute('aria-checked',H.sym);
  let p=null;while(!p)p=genHuddle(H.level);
  H.p=p;H.g=Array(p.n*p.n).fill(-1);H.won=false;H.just=-1;stroke=null;
  for(const i of p.givens)H.g[i]=p.sol[i];
  if(H.p.counts[H.paint]==null)H.paint=0;
  $('hd-win').hidden=true;hideToast('hd-toast');
  const grid=$('hd-grid');grid.classList.remove('won');
  grid.style.gridTemplateColumns=`repeat(${p.n},minmax(0,1fr))`;grid.innerHTML='';H.cells=[];
  for(let i=0;i<p.n*p.n;i++){ // cells are built once so a finger can keep sliding across them
    const b=document.createElement('button');b.id='hc'+i;b.dataset.i=i;
    b.onclick=e=>{if(e.detail===0){startStroke(i);endStroke()}}; // keyboard activation; pointer input is handled below
    grid.appendChild(b);H.cells.push(b);
  }
  renderHuddle();H.timer.start();
}
function clueState(i){
  const p=H.p,nb=nbrs(p.n,i),need=p.num[i],k=H.g[i];
  if(k<0)return'';
  const same=nb.filter(j=>H.g[j]===k).length,unknown=nb.filter(j=>H.g[j]<0).length;
  if(same>need||same+unknown<need)return'bad';
  return unknown===0?'met':'';
}
function renderHuddle(){
  const p=H.p,n=p.n,clue=new Set(p.clues),giv=new Set(p.givens);
  H.cells.forEach((b,i)=>{
    const k=H.g[i];
    b.className='hc'+(k>=0?' k'+k:'')+(giv.has(i)?' given':'')+(i===H.just?' just':'');
    let html=k>=0&&H.sym?`<span class="gl">${GLYPH[k]}</span>`:'';
    if(clue.has(i))html+=`<span class="num ${clueState(i)}">${p.num[i]}</span>`;
    b.innerHTML=html;
    b.setAttribute('aria-label',`Row ${(i/n|0)+1}, column ${i%n+1}: ${k>=0?CNAME[k]:'empty'}${clue.has(i)?', clue '+p.num[i]:''}${giv.has(i)?', fixed':''}`);
  });
  H.just=-1;
  const pal=$('hd-pal');pal.innerHTML='';
  p.counts.forEach((c,k)=>{
    const left=c-H.g.filter(x=>x===k).length;
    const b=document.createElement('button');b.className='sw'+(left<=0?' out':'');b.id='pc'+k;
    b.style.background=`linear-gradient(165deg,var(--h${k}b),var(--h${k}))`;b.style.color=`var(--t${k})`;
    b.setAttribute('aria-pressed',H.paint===k);b.setAttribute('aria-label',`${CNAME[k]}, ${left} left`);
    b.innerHTML=`${H.sym?`<span class="g">${GLYPH[k]}</span>`:''}${left}`;
    b.onclick=()=>{H.paint=k;buzz(5);renderHuddle()};
    pal.appendChild(b);
  });
  const e=document.createElement('button');e.className='sw erase';e.id='pc-erase';e.setAttribute('aria-pressed',H.paint===-1);e.setAttribute('aria-label','Eraser');
  e.innerHTML=`<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>`;e.onclick=()=>{H.paint=-1;buzz(5);renderHuddle()};
  pal.appendChild(e);
}
function connectedOk(){
  const p=H.p;
  return p.counts.every((c,k)=>{const cells=range(p.n*p.n).filter(i=>H.g[i]===k);return !cells.length||flood(p.n,cells[0],i=>H.g[i]===k).size===cells.length});
}

/* Paint by pressing and sliding. A press on a square already in the active color starts an erasing stroke instead. */
let stroke=null;
function startStroke(i){
  if(H.won||stroke)return;
  stroke={mode:null,changed:false,warned:false,lastCell:i,x:null,y:null};
  strokeCell(i,true);
}
function strokeCell(i,first){
  const p=H.p;
  if(p.givens.includes(i)){if(first)toast('hd-toast','That square is fixed');return}
  if(!stroke.mode)stroke.mode=H.paint<0||H.g[i]===H.paint?'erase':'paint'; // set by the first square that can change
  if(stroke.mode==='erase'){if(H.g[i]<0)return;H.g[i]=-1}
  else{
    if(H.g[i]===H.paint)return;
    const left=p.counts[H.paint]-H.g.filter(x=>x===H.paint).length;
    if(left<=0){if(!stroke.warned){toast('hd-toast',`No ${CNAME[H.paint].toLowerCase()} left`,true);buzz([10,40,10])}stroke.warned=true;return}
    H.g[i]=H.paint;
  }
  stroke.changed=true;stroke.lastCell=i;H.just=i;buzz(4);renderHuddle();
}
function endStroke(){
  if(!stroke)return;
  const s=stroke;stroke=null;
  if(!s.changed)return;
  const p=H.p,i=s.lastCell,full=H.g.every(x=>x>=0);
  const cluesOk=p.clues.every(c=>clueState(c)==='met');
  if(full&&cluesOk&&connectedOk()){
    H.won=true;H.timer.stop();buzz([15,60,25]);
    const n=p.n,r0=i/n|0,c0=i%n;
    H.cells.forEach((el,j)=>{el.classList.remove('just');el.style.animationDelay=`${(Math.abs((j/n|0)-r0)+Math.abs(j%n-c0))*55}ms`});
    $('hd-grid').classList.add('won');
    const t=fmt(H.timer.secs());
    setTimeout(()=>showWin('hd-win','Huddled up',`${n}×${n} · ${t}`,`🟨 Huddle ${n}×${n} · ${t}`,newHuddle),reduceMotion?0:500);
  }else if(full&&!cluesOk)toast('hd-toast','A number is off',true);
  else if(full)toast('hd-toast','A color is split in two',true);
  else hideToast('hd-toast');
}
function cellAt(x,y){const el=document.elementFromPoint(x,y),c=el&&el.closest&&el.closest('.hc');return c&&$('hd-grid').contains(c)?+c.dataset.i:-1}
$('hd-grid').addEventListener('pointerdown',e=>{
  if(e.button>0)return;
  const i=cellAt(e.clientX,e.clientY);if(i<0)return;
  e.preventDefault();
  startStroke(i);
  if(stroke){stroke.x=e.clientX;stroke.y=e.clientY}
});
addEventListener('pointermove',e=>{
  if(!stroke)return;
  // walk the straight line from the last point so a quick swipe doesn't skip squares
  const size=H.cells[0].getBoundingClientRect().width,dx=e.clientX-stroke.x,dy=e.clientY-stroke.y;
  const steps=Math.max(1,Math.ceil(Math.hypot(dx,dy)/(size/3)));
  for(let t=1;t<=steps;t++){const i=cellAt(stroke.x+dx*t/steps,stroke.y+dy*t/steps);if(i>=0&&i!==stroke.lastCell)strokeCell(i,false)}
  stroke.x=e.clientX;stroke.y=e.clientY;
});
addEventListener('pointerup',endStroke);
addEventListener('pointercancel',endStroke);
$('hd-grid').addEventListener('contextmenu',e=>e.preventDefault());

$('hd-new').onclick=newHuddle;
$('hd-clear').onclick=()=>{if(H.won)return;H.g=H.g.map((x,i)=>H.p.givens.includes(i)?x:-1);hideToast('hd-toast');renderHuddle()};
for(const b of $('hd-diff').querySelectorAll('button'))b.onclick=()=>{H.level=b.dataset.l;segSet($('hd-diff'),b);newHuddle()};
$('hd-sym').onclick=()=>{H.sym=!H.sym;store('sh-sym',H.sym?'1':'0');$('hd-sym').setAttribute('aria-checked',H.sym);renderHuddle()};
helpInit('hd');

showTab(store('sh-tab')==='huddle'?'huddle':'scales');
</script>
</body>
